<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{.StatusCode}} {{.StatusText}} — Commit</title>
    <link rel="icon" href="/favicon.ico">
    <script defer data-domain="commit.jaw.dev" src="https://plausible.jaw.dev/js/script.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f7f7f4;
            --surface: #ffffff;
            --surface-muted: #efefeb;
            --text: #171715;
            --muted: #666661;
            --border: #d9d9d3;
            --accent: #a62f1a;
            --shadow: 0 20px 60px rgba(23, 23, 21, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(216, 75, 47, 0.12), transparent 34rem),
                var(--background);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        .shell {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 750;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            background: var(--text);
            color: var(--background);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .github {
            color: var(--muted);
            font-size: 0.92rem;
            text-decoration: none;
        }

        .github:hover {
            color: var(--text);
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.7fr);
            gap: 70px;
            align-items: center;
            min-height: calc(100vh - 190px);
            padding: 70px 0 110px;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: -0.065em;
        }

        .message {
            max-width: 590px;
            margin: 28px 0 34px;
            color: var(--muted);
            font-size: 1.15rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 20px;
            border: 1px solid var(--text);
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .button-primary {
            background: var(--text);
            color: var(--background);
        }

        .button-secondary {
            border-color: var(--border);
            background: var(--surface);
        }

        .status-card {
            position: relative;
            display: grid;
            min-height: 340px;
            place-items: center;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .status-card::before,
        .status-card::after {
            position: absolute;
            width: 190px;
            height: 190px;
            border: 1px solid var(--border);
            border-radius: 50%;
            content: "";
        }

        .status-card::before {
            top: -100px;
            right: -70px;
        }

        .status-card::after {
            bottom: -120px;
            left: -50px;
        }

        .status-code {
            position: relative;
            z-index: 1;
            color: var(--accent);
            font: 800 clamp(5.5rem, 14vw, 9rem)/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: -0.08em;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #11110f;
                --surface: #1a1a17;
                --surface-muted: #262621;
                --text: #f3f3ed;
                --muted: #aaa9a0;
                --border: #34342e;
                --accent: #ef765d;
                --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            }
        }

        @media (max-width: 760px) {
            main {
                grid-template-columns: 1fr;
                gap: 48px;
                padding-top: 50px;
            }

            .status-card {
                min-height: 230px;
            }
        }

        @media (max-width: 480px) {
            .shell {
                width: min(100% - 28px, 1080px);
            }

            .github {
                display: none;
            }

            h1 {
                font-size: clamp(3rem, 17vw, 4.5rem);
            }
        }
    </style>
</head>
<body>
    <header class="shell">
        <a class="brand" href="/" aria-label="Commit home">
            <span class="brand-mark" aria-hidden="true">C</span>
            commit
        </a>
        <a class="github" href="https://github.com/wajeht/commit">GitHub</a>
    </header>

    <main class="shell">
        <div>
            <p class="eyebrow">Error {{.StatusCode}}</p>
            <h1>{{.StatusText}}</h1>
            <p class="message">{{.Message}}</p>
            <div class="actions">
                <a class="button button-primary" href="/">Back home</a>
                <a class="button button-secondary" href="https://github.com/wajeht/commit/issues">Report an issue</a>
            </div>
        </div>

        <div class="status-card" aria-hidden="true">
            <span class="status-code">{{.StatusCode}}</span>
        </div>
    </main>
</body>
</html>
